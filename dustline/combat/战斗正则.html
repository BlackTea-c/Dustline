<!doctype html>
<!-- 酒馆助手局部正则「查找」：/<战斗>([\s\S]*?)<\/战斗>/g  捕获组会填进 #bt-raw-seed -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>尘世命轨 · 战斗 1.10</title>
<style>
:root{
  color-scheme:dark;--void:#07080c;--void-2:#0c0f16;--paper:#f4f0e6;--soft:#c9c3b4;
  --mute:#8d877a;--dim:#5c5850;--line:rgba(244,240,230,.08);--line-2:rgba(244,240,230,.2);
  --gold:#d4b07a;--gold-dim:rgba(212,176,122,.16);--gold-line:rgba(212,176,122,.42);
  --life:#7dcea0;--mana:#7eb8c9;--blood:#d45b52;--spirit:#b7a0e0;--bone:#c9a227;
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,monospace
}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bt{position:relative;max-width:820px;margin:0 auto;padding:0 0 10px;color:var(--paper);
  font:13px/1.4 var(--sans);overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 42% 26% at 50% 8%,rgba(212,91,82,.12),transparent 62%),
    radial-gradient(ellipse 50% 28% at 50% 100%,rgba(212,176,122,.11),transparent 68%),
    linear-gradient(180deg,#12161f,var(--void));
  border:1px solid var(--gold-line);
  box-shadow:inset 0 1px 0 rgba(244,240,230,.06),0 18px 40px rgba(0,0,0,.35)}
.bt>:not(.bt-fx):not(.bt-flash):not(.bt-banner):not(.bt-dbg-btn):not(.bt-dbg){position:relative;z-index:2}
.bt:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.08),transparent 18%,transparent 78%,rgba(0,0,0,.28)),
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.015) 4px);
  opacity:.7}
.bt.is-win{box-shadow:inset 0 0 90px rgba(212,176,122,.16),0 18px 40px rgba(0,0,0,.35)}
.bt.is-lose{box-shadow:inset 0 0 90px rgba(212,91,82,.2),0 18px 40px rgba(0,0,0,.35)}
.bt.is-flee{box-shadow:inset 0 0 80px rgba(126,184,201,.12),0 18px 40px rgba(0,0,0,.35)}
.bt-fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.bt-flash{position:absolute;inset:0;z-index:28;pointer-events:none;opacity:0}
.bt-flash.on.hit{background:radial-gradient(ellipse at 50% 20%,rgba(255,96,74,.3),transparent 56%)}
.bt-flash.on.hurt{background:radial-gradient(ellipse at 50% 82%,rgba(212,70,62,.4),transparent 58%)}
.bt-flash.on.guard{background:radial-gradient(ellipse at 50% 80%,rgba(212,176,122,.24),transparent 60%)}
.bt-flash.on.cast{background:radial-gradient(ellipse at 50% 50%,rgba(126,184,201,.2),transparent 60%)}
.bt-flash.on.burn{background:radial-gradient(ellipse at 50% 78%,rgba(230,90,40,.34),transparent 62%)}
.bt-flash.on{opacity:1}
.bt-flash.go{opacity:0;transition:opacity .62s ease}
.bt-banner{position:absolute;left:50%;top:36%;z-index:50;transform:translate(-50%,10px) scale(.9);
  padding:9px 26px;border:1px solid var(--gold-line);background:rgba(8,10,14,.86);
  font:600 22px/1 var(--serif);letter-spacing:.32em;color:var(--gold);pointer-events:none;opacity:0;
  box-shadow:0 12px 36px rgba(0,0,0,.5);white-space:nowrap}
.bt-banner.on{opacity:1;transform:translate(-50%,0) scale(1);transition:.32s cubic-bezier(.2,.8,.2,1)}
.bt-banner.win{letter-spacing:.46em;color:#f3d7a0}
.bt-banner.lose{color:#f0a8a2;border-color:rgba(212,91,82,.55)}
.bt-banner.flee{color:#9fd4e2;border-color:rgba(126,184,201,.45)}
.bt-float{position:absolute;font:800 28px/1 var(--serif);letter-spacing:.04em;
  animation:btPop 1.75s cubic-bezier(.16,.8,.3,1) forwards;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 12px rgba(0,0,0,.35);white-space:nowrap;z-index:40}
.bt-float.dmg{color:#ff6b5c}.bt-float.block{color:#f0d08a;font-size:18px}
.bt-float.heal{color:#8ee0b0}.bt-float.soul{color:#c9b4f0;font-size:18px}
.bt-float.miss{color:#e8dcc0;font-size:24px}
.bt-float.big{font-size:32px}.bt-float.crit{font-size:36px;color:#ffd27a;
  text-shadow:0 0 14px rgba(255,90,60,.7),0 3px 0 #000}
@keyframes btPop{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}
  12%{opacity:1;transform:translate(-50%,-8px) scale(1.16)}
  58%{opacity:1;transform:translate(-50%,-26px) scale(1.04)}
  100%{opacity:0;transform:translate(-50%,-78px) scale(.9)}}
.bt-impact{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  border:2px solid #fff4dc;box-shadow:0 0 16px rgba(255,186,120,.75);animation:btImpact .7s ease forwards;z-index:41}
@keyframes btImpact{0%{transform:scale(.25);opacity:1}100%{transform:scale(3.4);opacity:0}}
.bt-cast{position:absolute;left:50%;top:44%;z-index:42;font:600 17px/1 var(--serif);letter-spacing:.2em;
  color:var(--gold);opacity:0;animation:btCast .9s ease forwards;text-shadow:0 2px 14px rgba(0,0,0,.65);pointer-events:none}
.bt-cast.atk{color:#ff8a7a}.bt-cast.def{color:#f0d08a}.bt-cast.util{color:#9fd4e2}
@keyframes btCast{0%{opacity:0;transform:translate(-50%,12px) scale(.88)}
  18%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  62%{opacity:1;transform:translate(-50%,-6px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-22px)}}
.bt-card-fly{position:absolute;z-index:45;pointer-events:none;margin:0!important;
  transition:transform .72s cubic-bezier(.2,.85,.2,1),opacity .72s}
.bt-card-fly.go{transform:translateY(-78px) scale(1.08) rotate(-7deg);opacity:0}
.bt-spark{position:absolute;bottom:28%;width:5px;height:5px;border-radius:50%;background:#f0d08a;
  box-shadow:0 0 8px #f0d08a;animation:btSpark 1.2s ease-out forwards}
@keyframes btSpark{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(.3);opacity:0}}
.bt-dbg-btn{position:absolute;left:6px;top:6px;z-index:55;width:22px;height:22px;
  font:700 9px/1 var(--mono);letter-spacing:.04em;color:var(--gold);
  border:1px solid var(--gold-line);background:rgba(8,10,14,.82)}
.bt-dbg-btn.on,.bt-dbg-btn:hover{background:var(--gold-dim);color:var(--paper)}
.bt-dbg{position:absolute;left:6px;top:32px;z-index:56;width:min(440px,calc(100% - 12px));
  padding:8px;border:1px solid var(--gold-line);background:rgba(8,10,14,.94);
  box-shadow:0 12px 28px rgba(0,0,0,.45)}
.bt-dbg[hidden]{display:none!important}
.bt-dbg .hd{display:flex;align-items:center;gap:6px;margin-bottom:6px;
  font:600 11px/1 var(--serif);letter-spacing:.08em;color:var(--gold)}
.bt-dbg .hd span{flex:1;font:400 9px/1.3 var(--sans);letter-spacing:0;color:var(--dim)}
.bt-dbg .hd button{padding:3px 7px;border:1px solid var(--line-2);color:var(--soft);background:rgba(0,0,0,.25)}
.bt-dbg .hd button:hover{border-color:var(--gold-line);color:var(--gold)}
.bt-dbg textarea{display:block;width:100%;min-height:168px;max-height:280px;resize:vertical;
  padding:8px;border:1px solid var(--line-2);background:#0b0d12;color:var(--paper);
  font:400 11px/1.55 var(--mono)}
.bt-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:6px 10px 2px 32px}
.bt-top h2{font:600 15px/1.2 var(--serif);letter-spacing:.06em}
.bt-top small{display:inline;margin:0;font:400 9px/1.3 var(--mono);letter-spacing:.08em;color:var(--dim)}
.bt-orbs{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.bt-orb{width:12px;height:12px;border-radius:50%;border:1px solid var(--gold-line);
  background:radial-gradient(circle at 35% 30%,#f0e0b8,var(--gold) 55%,#8a6d3a);
  box-shadow:0 0 6px rgba(212,176,122,.4);animation:btOrb 2.2s ease-in-out infinite}
.bt-orb.off{background:#1a1c22;border-color:var(--line-2);box-shadow:none;animation:none}
@keyframes btOrb{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}
.bt-turn{margin-left:auto;min-width:44px;text-align:center;padding:3px 7px;border:1px solid var(--gold-line);background:var(--gold-dim)}
.bt-turn b{display:block;font:600 16px/1 var(--mono);color:var(--gold)}
.bt-turn span{font:400 8px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
.bt-ver{display:block;margin-top:2px;font:400 8px/1 var(--mono);letter-spacing:.08em;color:var(--dim)}
.bt-stage{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:2px 8px 0}
.bt-party{display:flex;align-items:stretch;justify-content:center;gap:6px;margin:4px 8px 0;flex-wrap:wrap}
.bt-actor{position:relative;padding:4px 6px 6px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 50%),rgba(8,10,14,.5);
  border:1px solid var(--line-2);transition:border-color .18s,box-shadow .18s,transform .18s}
.bt-actor.foe{width:122px;min-height:0;border:1px solid rgba(212,91,82,.35);
  background:radial-gradient(circle at 50% 0%,rgba(212,91,82,.14),transparent 46%),rgba(8,10,14,.55);
  box-shadow:inset 0 0 0 1px rgba(212,91,82,.08);cursor:pointer}
.bt-actor.foe:hover:not(.is-dead){transform:translateY(-2px);border-color:rgba(212,91,82,.6)}
.bt-stage.many .bt-actor.foe{width:110px;padding:4px 5px 5px}
.bt-stage.crowd .bt-actor.foe{width:96px;padding:3px 4px 4px}
.bt-actor.foe.is-aim,.bt-actor.me.is-aim,.bt-actor.ally.is-aim{border-color:var(--gold-line);
  box-shadow:inset 0 0 0 1px rgba(212,176,122,.4),0 0 0 1px var(--gold-line),0 0 18px rgba(212,176,122,.18);z-index:2}
.bt-aim{display:none;position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:3;
  padding:1px 5px;font:700 8px/1 var(--mono);letter-spacing:.16em;color:#1a1408;background:var(--gold)}
.bt-actor.is-aim .bt-aim{display:block}
.bt-actor.foe.is-dead{opacity:.38;cursor:default;filter:grayscale(.4)}
.bt-actor.is-low .bt-hpbar{border-color:rgba(212,91,82,.55);box-shadow:0 0 8px rgba(212,91,82,.28)}
.bt-actor.is-danger{animation:btDanger 1.15s ease-in-out infinite}
@keyframes btDanger{0%,100%{box-shadow:inset 0 0 0 1px rgba(212,91,82,.12)}
  50%{box-shadow:inset 0 0 0 1px rgba(212,91,82,.55),0 0 14px rgba(212,91,82,.22)}}
.bt-actor.me{display:flex;flex-direction:column;align-items:center;gap:0;margin:0;min-height:0;padding:4px 6px 6px;flex:0 0 136px;width:136px;cursor:pointer;
  border-color:var(--gold-line);background:linear-gradient(180deg,rgba(212,176,122,.07),rgba(8,10,14,.5))}
.bt-actor.ally{flex:0 0 112px;width:112px;padding:4px 6px 6px;min-height:0;border-color:rgba(125,206,160,.35);cursor:pointer;
  background:linear-gradient(180deg,rgba(125,206,160,.08),rgba(8,10,14,.5))}
.bt-actor.ally.is-dead{opacity:.38}
.bt-actor.is-hit{animation:btHit .62s cubic-bezier(.2,.7,.3,1)}
@keyframes btHit{0%,100%{transform:translateX(0)}18%{transform:translateX(-11px) rotate(-1.2deg)}
  42%{transform:translateX(8px) rotate(1deg)}68%{transform:translateX(-4px)}}
.bt-actor.is-hit .bt-seal:after{content:"";position:absolute;inset:0;z-index:2;
  background:rgba(255,230,210,.38);animation:btFlashFace .55s ease}
.bt-seal{width:76px;height:76px;margin:0 auto 4px;display:grid;place-items:center;border-radius:50%;overflow:hidden;position:relative;
  font:600 28px/1 var(--serif);color:#e8b4b0;border:2px solid rgba(212,91,82,.5);
  background:radial-gradient(circle at 38% 30%,rgba(232,180,176,.28),#1a1012 62%,#0e0a0c);
  box-shadow:0 0 0 4px rgba(212,91,82,.08),0 4px 12px rgba(0,0,0,.35)}
.bt-actor.me .bt-seal{width:80px;height:80px;margin:0 auto 4px;flex:none;font-size:28px;color:var(--gold);border-color:var(--gold-line);
  background:radial-gradient(circle at 38% 30%,rgba(232,210,160,.28),#16120c 62%,#0c0a08);
  box-shadow:0 0 0 3px rgba(212,176,122,.1)}
.bt-actor.ally .bt-seal{width:68px;height:68px;margin:0 auto 4px;font-size:24px;color:var(--life);
  border-color:rgba(125,206,160,.45);background:radial-gradient(circle at 38% 30%,rgba(160,232,176,.25),#10140f 62%,#080c08)}
.bt-stage.crowd .bt-seal{width:64px;height:64px;font-size:22px}
.bt-seal b{position:relative;z-index:0}
.bt-seal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.bt-me-main{width:100%;min-width:0;text-align:center}
.bt-actor.me .bt-orbs{margin-top:4px;justify-content:center}
.bt-actor h3{font:600 13px/1.15 var(--serif);letter-spacing:.04em}
.bt-actor.me h3{font-size:14px}
.bt-actor h3 i{display:block;margin-top:1px;font:400 9px/1.25 var(--mono);color:var(--gold);font-style:normal;letter-spacing:.04em}
.bt-hp{margin-top:4px;clear:both}
.bt-hp-row{display:flex;align-items:center;gap:4px}
.bt-shield{min-width:18px;height:18px;display:grid;place-items:center;font:700 9px/1 var(--mono);
  color:var(--void);background:var(--gold);clip-path:polygon(50% 0,100% 22%,86% 100%,14% 100%,0 22%)}
.bt-hpbar{flex:1;height:11px;background:#14181e;border:1px solid rgba(125,206,160,.3);overflow:hidden;position:relative}
.bt-hpbar i.ghost{position:absolute;top:0;left:0;height:100%;background:#8a3832;opacity:.72;transition:width .9s ease}
.bt-hpbar i.hp{display:block;position:relative;z-index:1;height:100%;
  background:linear-gradient(180deg,#c8f0d8,#5eaa7e 46%,#3d7a58);transition:width .28s ease}
.bt-hpbar i.hp:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  animation:btBarShine 2.8s ease-in-out infinite}
@keyframes btBarShine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.bt-hpbar i.blk{position:absolute;top:0;height:100%;z-index:1;background:linear-gradient(90deg,#b8944a,var(--gold));opacity:.92;pointer-events:none}
.bt-hpbar b{position:absolute;inset:0;display:grid;place-items:center;font:600 8px/1 var(--mono);color:#f4f0e6;text-shadow:0 1px 2px #000;z-index:2}
.bt-subbars{margin-top:3px;display:grid;gap:2px}
.bt-sbar{height:3px;background:rgba(255,255,255,.06);overflow:hidden}
.bt-sbar i{display:block;height:100%;transition:width .3s}
.bt-sbar.sp i{background:var(--spirit)}.bt-sbar.mp i{background:var(--mana)}.bt-sbar.bl i{background:var(--blood)}
.bt-powers{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:4px}
.bt-actor.me .bt-powers{justify-content:center}
.bt-pow{padding:1px 4px;font:500 9px/1.2 var(--sans);border:1px solid var(--line-2);color:var(--soft);background:rgba(0,0,0,.2)}
.bt-pow.block{color:var(--gold);border-color:var(--gold-line);background:var(--gold-dim)}
.bt-pow.bad{color:#f0a8a2;border-color:rgba(212,91,82,.4)}
.bt-pow.good{color:var(--life);border-color:rgba(125,206,160,.35)}
.bt-intents{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:0 0 3px}
.bt-ib{min-width:42px;padding:2px 4px 2px;text-align:center;border:1px solid rgba(212,91,82,.5);
  background:rgba(18,6,6,.75);clip-path:polygon(12% 0,88% 0,100% 18%,100% 82%,88% 100%,12% 100%,0 82%,0 18%)}
.bt-ib:not(.def):not(.heal):not(.soul){animation:btIntent 1.7s ease-in-out infinite}
.bt-ib em{display:block;font:700 13px/1 var(--serif);color:#f0c2bc;font-style:normal}
.bt-ib span{display:block;font-size:8px;line-height:1.2;color:var(--soft)}
.bt-ib.def{border-color:var(--gold-line);background:rgba(30,24,10,.5)}
.bt-ib.def em{color:var(--gold)}
.bt-ib.soul{border-color:rgba(183,160,224,.45);background:rgba(20,12,32,.55)}
.bt-ib.soul em{color:#d4c4f0}
.bt-ib.heal{border-color:rgba(125,206,160,.45);background:rgba(10,24,16,.55)}
.bt-ib.heal em{color:var(--life)}
.bt-actor.me.is-down{opacity:.42;filter:grayscale(.35)}
.bt-next{margin:0 0 3px;font:400 8px/1.3 var(--mono);letter-spacing:.06em;color:var(--dim)}
.bt-stage.crowd .bt-actor h3 i,.bt-stage.crowd .bt-powers{display:none}
.bt-slash{position:absolute;width:48%;height:3px;right:7%;top:26%;
  background:linear-gradient(90deg,transparent,var(--gold),#fff8e8);
  transform-origin:right center;animation:btSlash .62s ease forwards;box-shadow:0 0 16px rgba(212,176,122,.75)}
@keyframes btSlash{0%{opacity:0;transform:rotate(-28deg) scaleX(.15)}
  32%{opacity:1;transform:rotate(-28deg) scaleX(1)}
  100%{opacity:0;transform:rotate(-14deg) scaleX(1.12)}}
.bt-vs{display:flex;align-items:center;justify-content:center;gap:10px;margin:3px 18px 1px;
  font:600 10px/1 var(--serif);letter-spacing:.42em;color:var(--dim)}
.bt-vs:before,.bt-vs:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-line),transparent)}
.bt-card em{display:block;margin-top:4px;font:400 9px/1 var(--mono);color:var(--gold);font-style:normal}
.bt-rail{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;padding:6px 8px 0;margin-top:2px;border-top:1px solid var(--line)}
.bt-rail:before{content:"常驻 · 场景";flex:0 0 100%;text-align:center;font:400 8px/1 var(--mono);letter-spacing:.16em;color:var(--dim);margin-bottom:1px}
.bt-pill{display:flex;flex-direction:row;align-items:center;gap:5px;max-width:none;
  padding:5px 8px;border:1px solid var(--line-2);background:rgba(10,12,16,.78);
  font:500 11px/1 var(--serif);letter-spacing:.04em;color:var(--soft);transition:.15s;text-align:left}
.bt-pill b{margin-left:0;font:700 11px/1 var(--mono);color:var(--gold)}
.bt-pill i{display:none}
.bt-pill:hover:not(:disabled){border-color:var(--gold-line);color:var(--paper);background:var(--gold-dim);transform:translateY(-1px)}
.bt-pill:active:not(:disabled){transform:translateY(1px)}
.bt-pill.on{border-color:var(--gold-line);color:var(--gold);background:var(--gold-dim);box-shadow:0 0 10px rgba(212,176,122,.2)}
.bt-pill:disabled{opacity:.34;cursor:default}
.bt-pill.scene{border-style:dashed;color:var(--bone)}
.bt-fate{margin:16px auto 0;max-width:520px;text-align:left}
.bt-fate p{margin:0 0 8px}
.bt-fate-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.bt-fate-row b{flex:1;font:600 14px/1.2 var(--serif)}
.bt-pick{padding:5px 12px;border:1px solid var(--line-2);color:var(--soft);background:rgba(0,0,0,.2)}
.bt-pick.on{border-color:var(--gold-line);color:var(--gold);background:var(--gold-dim)}
.bt-pick.kill.on{border-color:rgba(212,91,82,.55);color:#f0a8a2;background:rgba(212,91,82,.12)}
.bt-energy{display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 8px 0;
  font:400 9px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.bt-play-row{display:flex;align-items:flex-end;gap:8px;padding:0 8px}
.bt-fan-wrap{flex:1;min-width:0;min-height:148px;padding:0}
.bt-fan{display:flex;justify-content:center;align-items:flex-end;height:148px;padding:0 8px 2px;overflow-x:auto;overflow-y:visible}
.bt-card{position:relative;width:104px;height:136px;flex:0 0 104px;margin:0 -18px;padding:10px 8px 8px;
  text-align:left;contain:layout;border:1px solid #8a7350;
  background:linear-gradient(180deg,#221c16,#12100c);
  box-shadow:0 8px 16px rgba(0,0,0,.45),inset 0 0 0 1px #0a0907,inset 0 0 0 2px rgba(212,176,122,.35);
  transform:rotate(var(--r,0deg)) translateY(var(--y,0));transform-origin:50% 140%;
  transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s,box-shadow .16s;z-index:1}
.bt-card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(232,220,190,.2)}
.bt-card.atk:before{background:var(--blood)}.bt-card.def:before{background:var(--gold)}.bt-card.util:before{background:var(--mana)}
.bt-card:hover:not(:disabled){transform:rotate(0) translateY(-26px) scale(1.07);z-index:20;
  border-color:#e6c98a;box-shadow:0 16px 28px rgba(0,0,0,.5),0 0 18px rgba(212,176,122,.2)}
.bt-card:active:not(:disabled){transform:rotate(0) translateY(-14px) scale(1.02)}
.bt-card:disabled{filter:grayscale(.35) brightness(.72);cursor:default}
.bt-card u{position:absolute;left:6px;top:7px;text-decoration:none;width:18px;height:18px;
  display:grid;place-items:center;font:700 10px/1 var(--mono);color:#1a1408;background:var(--gold);border-radius:50%}
.bt-card b{display:block;margin-top:18px;font:600 14px/1.15 var(--serif);letter-spacing:.03em}
.bt-card i{display:block;margin-top:6px;font:400 10px/1.35 var(--sans);color:var(--soft);font-style:normal}
.bt-card.atk{background:linear-gradient(180deg,#2a1816,#12100c)}
.bt-card.def{background:linear-gradient(180deg,#221c12,#12100c)}
.bt-card.util{background:linear-gradient(180deg,#141c20,#12100c)}
.bt-piles{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.bt-pile{width:36px;height:40px;border:1px solid var(--line-2);background:#12141a;display:grid;place-items:center;
  font:400 8px/1.15 var(--mono);color:var(--dim);letter-spacing:.04em;cursor:pointer}
.bt-pile:hover{border-color:var(--gold-line)}
.bt-pile b{display:block;font:700 14px/1 var(--mono);color:var(--gold)}
.bt-btn{padding:8px 16px;font:600 12px/1 var(--sans);letter-spacing:.14em;color:#1a1408;
  background:linear-gradient(180deg,#e6c98a,var(--gold));border:1px solid #f0d9a4;
  box-shadow:0 2px 0 #8a6d3a,0 6px 14px rgba(0,0,0,.25);transition:transform .12s,filter .12s}
.bt-play-row .bt-btn{align-self:flex-end;margin-bottom:10px;padding:10px 12px;letter-spacing:.1em}
.bt-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.bt-btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 0 0 #8a6d3a}
.bt-btn:disabled{opacity:.35;cursor:default}
.bt-btn.nudge{animation:btNudge 1.35s ease-in-out infinite;box-shadow:0 0 16px rgba(212,176,122,.4)}
@keyframes btNudge{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
.bt-log{margin:8px 10px 0;padding:6px 8px;max-height:88px;overflow-y:auto;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.36))}
.bt-log p{font:400 10px/1.55 var(--mono);color:var(--soft);padding:1px 2px}
.bt-log p.me{color:var(--gold)}.bt-log p.foe{color:#e8b4b0}.bt-log p.ally{color:#9ed4b4}.bt-log p.sys{color:var(--dim)}
.bt-log p.now{color:var(--paper);background:rgba(212,176,122,.1)}
.bt-log p.hint{margin-top:4px;color:var(--gold);letter-spacing:.04em}
.bt-over{margin:16px 20px 0;padding:22px 20px;border:1px solid var(--gold-line);
  background:linear-gradient(180deg,rgba(212,176,122,.16),rgba(8,10,14,.6));text-align:center;
  animation:btOverIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes btOverIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.bt-over b{font:600 36px/1.1 var(--serif);letter-spacing:.18em}
.bt-over p{margin-top:10px;font:400 12px/1.8 var(--sans);color:var(--soft)}
.bt-over table{margin:14px auto 0;border-collapse:collapse;font:400 12px/1.6 var(--mono);text-align:left}
.bt-over td{padding:3px 18px 3px 0;color:var(--mute)}.bt-over td:last-child{color:var(--paper)}
.bt-report{display:block;width:100%;max-width:520px;margin:14px auto 10px;min-height:128px;
  padding:10px 12px;resize:vertical;border:1px solid var(--line-2);background:rgba(0,0,0,.35);
  color:var(--soft);font:400 11px/1.65 var(--mono);text-align:left}
.bt-toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);z-index:60;
  padding:10px 18px;font:400 12px/1 var(--sans);letter-spacing:.06em;color:var(--void);background:var(--gold);
  border:1px solid #f0d9a4;box-shadow:0 10px 28px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.22s}
.bt-toast.on{opacity:1;transform:translateX(-50%)}
@keyframes btFlashFace{0%{opacity:.7}100%{opacity:0}}
@keyframes btIntent{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation:none!important}
  .bt-flash,.bt-banner,.bt-float,.bt-impact,.bt-cast,.bt-card-fly,.bt-spark{display:none!important}
}

<body>
<div class="bt" id="bt">
  <div class="bt-fx" id="bt-fx"></div>
  <div class="bt-flash" id="bt-flash"></div>
  <div class="bt-banner" id="bt-banner" hidden></div>

  <div class="bt-vs" aria-hidden="true">战</div>
  <div class="bt-party" id="bt-party"><section class="bt-actor me" id="bt-me" data-mark="me"></section></div>
  <div id="bt-play"></div>
  <div class="bt-log" id="bt-log"></div>
</div>
<div class="bt-toast" id="bt-toast"></div>
<script>
(function(){
  var s=document.getElementById('bt-sub');if(s)s.textContent='运行外壳已启动';
  window.addEventListener('error',function(e){if(e.target&&e.target!==window&&e.target!==document)return;
    var d=e.message||(e.error&&e.error.message),n=document.getElementById('bt-sub');
    if(n&&d)n.textContent='脚本错误 · '+d+(e.lineno?' @'+e.lineno+':'+e.colno:'')},true);
  window.addEventListener('unhandledrejection',function(e){var n=document.getElementById('bt-sub');
    if(n)n.textContent='异步错误 · '+((e.reason&&(e.reason.message||e.reason))||'未知')});
})();

<script type="module">
'use strict';
const VER='1.11';
const LOG_HINT='（根据战斗日志渲染战斗过程）';
let debugOverride='';
const AMP=String.fromCharCode(38);
const qs=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>AMP+'#'+c.charCodeAt(0)+';');
const obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{},rows=v=>Object.entries(obj(v));
const num=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const nodeOf=v=>Array.isArray(v)?nodeOf(v[0]):v;
const unwrap=v=>Array.isArray(v)?unwrap(v[0]):v&&typeof v==='object'
  ?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,unwrap(x)])):v;
const has=(a,k)=>Array.isArray(a)&&a.includes(k);
const hasRoot=(who,k)=>has(who&&who.roots,k);

const pools=dc=>({
  体魄:Math.round(70+dc*.9),
  神识:Math.round(20+dc*1.4),
  精血:Math.round(60+dc*.5),
  灵力池:Math.max(6,Math.round(dc*2.2)),
  每回合灵力:dc>=88?5:dc>=49?4:3
});
const TIER={黄:.8,玄:1,地:1.3,天:1.7,仙:2.2};
const dcTable=s=>{
  const t=String(s??'');
  if(/凡人/.test(t)&&!/炼气|筑基|金丹|元婴|出窍|化神|炼虚|合体|渡劫|大乘/.test(t))return 0;
  if(/炼气/.test(t)){
    if(/圆满/.test(t))return 10;
    const cn=t.match(/([一二三四五六七八九])层/);
    if(cn)return'一二三四五六七八九'.indexOf(cn[1])+1;
    const ar=t.match(/(\d+)\s*层/);
    return ar?clamp(num(ar[1]),1,9):1;
  }
  const minor=/大圆满|巅峰/.test(t)?3:/圆满/.test(t)?3:/后期/.test(t)?2:/中期/.test(t)?1:0;
  const band=[['渡劫',173],['大乘',148],['合体',133],['炼虚',118],['化神',103],['出窍',88],['元婴',73],['金丹',49],['筑基',25]];
  for(const [k,b] of band)if(t.includes(k))return b+minor*3;
  return null;
};
const dcOf=s=>{
  const t=String(s??'');
  const tab=dcTable(t);
  if(tab!=null)return tab;
  const hit=t.match(/DC\s*[:：]?\s*(\d+)/i);
  return hit?num(hit[1]):0;
};
const pressDc=a=>a&&a.基dc!=null?a.基dc:a&&a.dc||0;
const gapMul=(a,b)=>{
  const d=a-b;
  if(d>=0)return clamp(1+d/45,1,2.1);
  return clamp(1+d/32,.32,1);
};
const powMul=dc=>1+dc/60;
function stackDamp(foeDc,vsDc){
  const d=foeDc-vsDc;
  if(d>=0)return 1;
  return clamp(1+d/28,.08,1);
}
function stackQtyHp(n){
  n=clamp(n,1,99);
  return 1+.22*Math.min(n-1,12)+.04*Math.max(0,n-13);
}
function stackQtyAtk(n){
  n=clamp(n,1,99);
  return 1+.06*Math.min(n-1,10)+.015*Math.max(0,n-11);
}
function stackHpMul(n,foeDc,vsDc){
  if(n<=1)return 1;
  return 1+(stackQtyHp(n)-1)*stackDamp(foeDc,vsDc);
}
function stackAtkMul(n,foeDc,vsDc){
  if(n<=1)return 1;
  return Math.round((1+(stackQtyAtk(n)-1)*stackDamp(foeDc,vsDc))*100)/100;
}
function renameStack(a){
  const base=a.显示||a.rec名||String(a.名||'').replace(/[×xX]\d+$/,'');
  a.显示=base;
  a.名=(a.stack||1)>1?`${base}×${a.stack}`:base;
}
const burnCost=who=>Math.max(1,Math.round(who.blMax*.15));
const burnOk=who=>!who.burned&&who.bl>=who.blMax*.4&&who.bl>=burnCost(who);

const ROOTS=[
  {k:'雷',皮:'惊蛰',牌:{名:'引雷',类:'atk',费:1,基:5,词:['麻痹'],说:'伤 {d}，附麻痹'}},
  {k:'火',皮:'灼芒',牌:{名:'燎原',类:'atk',费:1,基:4,词:['灼烧'],说:'伤 {d}，附灼烧'}},
  {k:'木',皮:'蔓生',牌:{名:'春荣',类:'util',费:1,基:6,词:['回血'],说:'生命 +{d}'}},
  {k:'金',皮:'锋锐',牌:{名:'断金',类:'atk',费:1,基:7,词:['穿透'],说:'伤 {d}，穿透'}},
  {k:'水',皮:'沤蚀',牌:{名:'濯流',类:'def',费:1,基:6,词:['抽牌'],说:'格挡 {d}，抽 1'}},
  {k:'土',皮:'垒石',牌:{名:'厚壁',类:'def',费:1,基:10,说:'格挡 {d}'}},
  {k:'风',皮:'裂罡',牌:{名:'遁形',类:'def',费:1,基:0,词:['闪避'],说:'闪避下一次攻击'}},
  {k:'冰',皮:'凝霜',牌:{名:'封息',类:'atk',费:1,基:3,词:['冰封'],说:'伤 {d}，附冰封'}}
];
const rootsOf=s=>ROOTS.filter(r=>String(s??'').includes(r.k)).slice(0,2);
const skinOf=s=>{const r=rootsOf(s);return r.length?r[0].皮:'御气'};

const SCENES={
  湿滑:{名:'借滑',说:'你闪避下一次攻击。本场限用一次。',向:'self',f:s=>{s.me.闪避=true;return'借滑 → 你 闪避就绪'}},
  高处:{名:'坠势',说:'对当前敌人造成 14 点伤害，你自己反伤 4。先点敌人。本场限用一次。',向:'foe',f:s=>{const t=needFoe(s);if(!t)return'';const d=hit(s,s.me,t,14);s.me.hp-=4;fxFloat(s.me,'-4','dmg');return`坠势 → ${woundText(t,d,s.me)}，你 血-4 余血${Math.max(0,s.me.hp)}`}},
  狭窄:{名:'逼角',说:'当前敌人无法闪避，其遁术成功率 −20%。先点敌人。本场限用一次。',向:'foe',f:s=>{const t=needFoe(s);if(!t)return'';t.逼角=true;return`逼角 → ${t.名} 无法闪避，遁-20%`}},
  开阔:{名:'拉开',说:'本场你的遁术成功率 +25%。本场限用一次。',向:'self',f:s=>{s.me.遁加=(s.me.遁加||0)+25;return'拉开 → 你 遁术+25%'}},
  黑暗:{名:'匿影',说:'全体还活着的敌人下回合不敢进攻。本场限用一次。',向:'allFoe',f:s=>{livingFoes(s).forEach(t=>t.隐匿=true);return`匿影 → ${livingFoes(s).map(t=>t.名).join('、')||'无人'} 下回合不攻`}},
  火场:{名:'借火',说:'当前敌人灼烧 +2 层，回合结束按层数掉血。先点敌人。本场限用一次。',向:'foe',f:s=>{const t=needFoe(s);if(!t)return'';t.灼烧=(t.灼烧||0)+2;return`借火 → ${t.名} 灼烧+2（现${t.灼烧}层）`}},
  水域:{名:'引流',说:'当前敌人冰封，其下回合费用 −1。先点敌人。本场限用一次。',向:'foe',f:s=>{const t=needFoe(s);if(!t)return'';t.冰封=Math.max(t.冰封||0,1);return`引流 → ${t.名} 冰封，下回合费用-1`}},
  废墟:{名:'塌方',说:'对当前敌人造成 10 点伤害，你与他各滞涩 +1。先点敌人。本场限用一次。',向:'foe',f:s=>{const t=needFoe(s);if(!t)return'';const d=hit(s,s.me,t,10);addSlow(s.me,1);addSlow(t,1);return`塌方 → ${woundText(t,d,s.me)}，你与其滞涩+1`}},
  人群:{名:'挟众',说:'全体敌人下回合不敢进攻。本场限用一次。',向:'allFoe',f:s=>{livingFoes(s).forEach(t=>t.隐匿=true);return`挟众 → ${livingFoes(s).map(t=>t.名).join('、')||'无人'} 下回合不攻`}},
  灵脉:{名:'汲脉',说:'你的灵力池立刻 +15，不超过上限。本场限用一次。',向:'self',f:s=>{const g=Math.min(15,s.me.mpMax-s.me.mp);s.me.mp+=g;return`汲脉 → 你 灵力池+${g}（现${s.me.mp}/${s.me.mpMax}）`}},
  禁制:{名:'借阵',说:'本回合你造成的伤害 +30%。本场限用一次。',向:'self',f:s=>{s.me.增伤=(s.me.增伤||0)+.3;return'借阵 → 你 本回合伤害+30%'}},
  雷雨:{名:'引雷',说:'你的下一张攻击牌伤害翻倍。雷灵根再附带麻痹。本场限用一次。',向:'self',f:s=>{s.me.翻倍=true;if(hasRoot(s.me,'雷'))s.me.雷雨麻=true;return`引雷 → 你 下一击翻倍${hasRoot(s.me,'雷')?'，并附麻痹':''}`}},
  大风:{名:'乘风',说:'立刻抽 2 张，本回合费用 +1。本场限用一次。',向:'self',f:s=>{const n=drawPlus(s,s.me,2);s.me.费++;return`乘风 → 你 抽${n}，费用+1（现${s.me.费}）`}},
  浓雾:{名:'迷障',说:'两回合内双方都看不见意图。本场限用一次。',向:'self',f:s=>{s.迷雾=2;return'迷障 → 双方两回合看不见意图'}},
  绝境:{名:'背水',说:'仅当你生命低于三成可用。本回合伤害翻倍。本场限用一次。',向:'self',f:s=>{
    if(s.me.hp>s.me.hpMax*.3)return'';s.me.增伤=(s.me.增伤||0)+1;return`背水 → 你 本回合伤害翻倍（生命${Math.round(s.me.hp)}/${s.me.hpMax}）`}}
};
const SCENE_ALIAS={暴风雪:'大风',风雪:'大风',暴雪:'大风',风刃:'大风',雷暴:'雷雨',雷电:'雷雨',迷雾:'浓雾',大雾:'浓雾',空域:'开阔',云层:'浓雾',电磁:'禁制',巷弄:'狭窄'};

function isBlankKit(s){
  const t=String(s||'').replace(/[。.\s]/g,'').trim();
  return !t||/^(无|没有|无有|暂无|空|none|na)$/i.test(t);
}
function parseKit(s){
  const raw=String(s||'').trim();
  if(isBlankKit(raw))return null;
  const m=raw.match(/^(.+?)\s*[（(]([^）)]*)[)）]\s*$/);
  const 名=(m?m[1]:raw).replace(/[（(].*$/,'').trim();
  if(!名)return null;
  const bits=String(m?m[2]:'').split(/[·、,，\/|\s]+/).map(x=>x.trim()).filter(Boolean);
  let 类='';
  const 词=[];
  bits.forEach(b=>{
    const mapped=mapType(b);
    if(mapped&&!类)类=mapped;
    else if(/护具|甲胄|铠/.test(b)&&!类)类='护具';
    else if(/法宝/.test(b)&&!类)类='法宝';
    else if(/符箓|符纸/.test(b)&&!类)类='符箓';
    else if(/兵器|兵刃|佩剑|刀|剑|戟|火器|枪械|热武|手枪|步枪/.test(b)&&!类)类='兵器';
    splitWords(b).forEach(w=>{if(!词.includes(w))词.push(w)});
    if(WORDS.includes(b)&&!词.includes(b))词.push(b);
  });
  return{名,类,词:词.slice(0,3)};
}
function kitIntent(kit,dc,from){

}

function wearKind(d,名=''){

  if(p==='兵器'||p==='是'||p==='已佩戴'||p==='佩戴'||WEAPON_HINT.test(blob)||['攻','兵','剑','刀','枪'].some(k=>t.includes(k)))return'兵器';

function retarget(s,a,act){

}
function npcDmg(s,a,t,基,opt={}){

}

function intentTable(name,dc,rec,style){

function realmOf(dc){

  if(dc>=118)return'炼虚';if(dc>=103)return'化神';if(dc>=88)return'出窍';
  if(dc>=73)return'元婴';if(dc>=49)return'金丹';if(dc>=25)return'筑基';
  if(dc>=1)return'炼气';return'凡人';
}
function foeActCount(s,foe){
  const f=foe||s.foe;
  const d=f.dc-s.me.dc;
  let n=2+Math.floor(Math.max(0,f.dc-20)/22);
  if(d>=30)n+=2;
  else if(d>=15)n++;
  else if(Math.abs(d)<15)n++;
  n=clamp(n,2,8);
  if((f.stack||1)>1){
    const extra=Math.min(2,Math.floor((f.stack-1)/8));
    n=clamp(n+Math.round(extra*stackDamp(f.dc,s.me.dc)),1,8);
  }
  const pack=livingFoes(s).length;

function whoName(s,a){return a===s.me?'你':(a&&(a.显示||a.名)||'?')}
function shortWho(s,t){

function actLabel(s,act){

  return who?`${act.名} ${who}`:act.名;
}
function applyAct(s,a,act,opt={}){
  if(!a||a.hp<=0||s.done)return;
  const side=npcSide(s,a)==='ally'?'ally':'foe';
  if((opt.hide||a.隐匿)&&act.型==='atk'){log(s,side,`${a.名} 收势不发`);return}
  const t=retarget(s,a,act);
  const you=x=>whoName(s,x);
  if(act.型==='heal'){
    if(!t)return;
    const h=Math.max(1,Math.round(act.基*powMul(a.dc)));
    t.hp=Math.min(t.hpMax,t.hp+h);
    fxHeal(t,h);
    log(s,side,`${a.名} ${act.名} → ${you(t)} 生命+${h} 余血${Math.max(0,Math.round(t.hp))}/${t.hpMax}`);
    return;
  }
  if(act.型==='def'){
    if(!t)return;
    const blk=Math.round(act.基*powMul(a.dc));
    t.格挡=(t.格挡||0)+blk;
    if(t!==a)t.护盾=true;
    fxFloat(t,'+'+blk,'block');
    log(s,side,`${a.名} ${act.名} → ${you(t)} 格挡+${blk}（现${t.格挡}）`);
    return;
  }
  if(act.型==='press'){
    if(act.向==='allFoe'){
      const bits=foesOf(s,a).map(v=>{
        if(s.done||over(s))return'';
        return a.dc<v.dc?`${you(v)} 压不住`:`${you(v)} ${press(s,a,v)}`;
      }).filter(Boolean);
      log(s,side,`${a.名} ${act.名} → ${bits.join('；')}`);
      return;
    }
    if(!t)return;
    log(s,side,`${a.名} ${act.名} → ${you(t)} ${press(s,a,t)}`);
    return;
  }
  if(act.型==='special'){
    if(!t)return;
    const w=act.词;
    if(w==='回血'){
      const pal=mostHurt(palsOf(s,a))||a;
      const h=Math.max(1,Math.round((6+a.dc/16)*powMul(a.dc)*1.4));
      pal.hp=Math.min(pal.hpMax,pal.hp+h);
      fxHeal(pal,h);
      log(s,side,`${a.名} 回血 → ${you(pal)} 生命+${h} 余血${Math.max(0,Math.round(pal.hp))}`);
      return;
    }
    if(w==='灼烧'){t.灼烧=(t.灼烧||0)+2;log(s,side,`${a.名} ${act.名} → ${you(t)} 灼烧+2（现${t.灼烧}层）`);return}
    if(w==='滞涩'){addSlow(t,1);log(s,side,`${a.名} ${act.名} → ${you(t)} 滞涩+1（现${t.滞涩}）`);return}
    if(w==='摄魂'){const soul=hitSoul(s,t,14);log(s,side,`${a.名} ${act.名} → ${soulText(t,soul)}`);return}
    if(w==='闪避'){a.闪避=true;log(s,side,`${a.名} ${act.名} → 闪避就绪`);return}
    if(w==='隐匿'){a.隐匿=true;log(s,side,`${a.名} ${act.名} → 收势隐匿`);return}
    addSlow(t,1);
    log(s,side,`${a.名} ${act.名} → ${you(t)}${w?' 附'+w:' 滞涩+1'}`);
    return;
  }
  if(!t||t.hp<=0)return;
  if(act.向==='allFoe'){
    const bits=foesOf(s,a).map(v=>woundText(v,hit(s,a,v,npcDmg(s,a,v,act.基,opt)),a));
    log(s,side,`${a.名} ${act.名} → ${bits.join('；')}`);
    return;
  }
  const words=act.词表||(act.词?[act.词]:[]);
  const d=hit(s,a,t,npcDmg(s,a,t,act.基,opt),{穿透:has(words,'穿透'),破防:has(words,'破防')});
  let extra='';
  if(act.词==='滞涩'&&!has(words,'滞涩')){addSlow(t,1);extra=' 滞涩+1'}
  if(words.length)extra+=applyWords(s,a,t,words,d.dmg,null);
  if(opt.punish)extra+=' 遁失败加伤';
  if(opt.weaken)extra+=' 减势';
  if(act.向==='cleave'||has(words,'溅射')){
    if(d.dmg>0){
      const splash=Math.max(1,Math.round(d.dmg*.35));
      const others=foesOf(s,a).filter(x=>x!==t);
      if(others.length)extra+=' 溅射'+others.map(x=>woundText(x,hit(s,a,x,splash,{穿透:true}),a)).join('、');
    }else extra+=' 未破盾无溅射';
  }
  log(s,side,`${a.名} ${act.名} → ${woundText(t,d,a)}${extra}`);
}
function foeMayFlee(s,foe){
  const f=foe||s.foe;
  if(livingFoes(s).length>1)return false;
  if(f.dc>s.me.dc)return false;
  const floor=(f.dc+8>=s.me.dc)?0.12:0.18;
  if(f.hp>f.hpMax*floor)return false;
  const rate=clamp(35+(s.me.dc-f.dc)*1.5,10,80);
  const roll=Math.floor(rnd(s.seed+s.turn*613)*100);
  if(roll<rate){
    log(s,'foe',`${f.名} ${styleName(s.体裁,'遁')}（${Math.round(rate)}% 掷${roll}）`);
    s.done='敌逃';return true;
  }
  return false;
}
function foeTurnOne(s,foe,punish){
  if(foe.hp<=0)return;

  if(!foe.护盾)foe.格挡=0;

  const n=foeActCount(s,foe);
  const acts=planActs(s,foe,n);
  log(s,'sys',`${foe.名} 出手 ×${n}`);
  acts.forEach((act,k)=>{
    if(s.done||over(s))return;
    applyAct(s,foe,act,{punish:!!(punish&&k===0),weaken:!!foe.减势,hide:!!foe.隐匿,k});
  });
  foe.减势=false;foe.隐匿=false;foe.封灵=false;
  if(foe.冰封>0)foe.冰封--;
}
function foeTurn(s,punish){

function allyTurn(s){
  (s.allies||[]).filter(a=>a.hp>0).forEach(ally=>{
    if(s.done||!livingFoes(s).length)return;

function press(s,from,to){
  const d=pressDc(from)-pressDc(to);
  const extra=hasRoot(from,'雷')&&d>0?1:0;
  if(d>0){
    const dmg=Math.min(50,Math.max(8,Math.round(d*1.5))),sl=Math.min(5,Math.max(1,Math.floor(d/4)))+extra;
    const r=hitSoul(s,to,dmg);addSlow(to,sl);
    const routed=applyPeel(to,crushStack(from,to));
    return`Δ${d} 神识-${r.took}（余${Math.max(0,Math.round(to.sp))}）${r.over?` 血-${r.over} 余血${Math.max(0,Math.round(to.hp))}`:''} 滞涩+${sl}${routed}`;

function crushStack(from,to){
  const n=to.stack||1;
  if(n<=1)return 0;
  const d=pressDc(from)-pressDc(to);
  if(d<=0)return 0;
  const ratio=clamp((d-4)/36,.18,.88);
  return Math.max(1,Math.min(n-1,Math.ceil(n*ratio)));

function applyPeel(to,peel){
  if(!peel||(to.stack||1)<=1)return'';
  const old=to.stack,vs=to.vsDc??0;
  to.stack=Math.max(1,old-peel);
  const next=stackHpMul(to.stack,to.dc,vs),prev=stackHpMul(old,to.dc,vs);
  const base=to.基hpMax||Math.round(to.hpMax/Math.max(prev,1e-6));
  to.基hpMax=base;
  to.hpMax=Math.max(1,Math.round(base*next));
  to.hp=Math.min(to.hpMax,Math.max(0,Math.round(to.hp*(prev>0?next/prev:1))));
  to.atkMul=stackAtkMul(to.stack,to.dc,vs);
  renameStack(to);
  return` 溃散${peel}人 余${to.stack>1?`×${to.stack}`:'单人'} 余血${Math.max(0,Math.round(to.hp))}`;
}

function applyWords(s,from,to,w,total,card){

    if(hasRoot(from,'冰')){addSlow(to,1);ex+=' 滞涩+1'}}

  if(has(w,'摄魂')){const r=hitSoul(s,to,12);ex+=` ${soulText(to,r)}`}
  if(has(w,'回气')){const n=TIER[card&&card.品]>=1.3?2:1;from.费+=n;ex+=` 灵力+${n}`}
  if(has(w,'减费')){from.减费=1;ex+=' 减费'}
  if(has(w,'反伤')){from.反伤=true;ex+=' 反伤'}
  if(has(w,'隐匿')){to.隐匿=true;ex+=' 隐匿'}
  if(has(w,'封灵')){to.封灵=true;ex+=' 封灵'}
  if(has(w,'驱散')){
    if(to.格挡>0){to.格挡=0;ex+=' 驱散格挡'}
    else if(to.闪避){to.闪避=false;ex+=' 驱散闪避'}

  }
  if(from.雷雨麻&&card&&card.类==='atk'){to.减势=true;from.雷雨麻=false;ex+=' 雷雨麻痹'}
  return ex;

function playScene(i){
  const s=S;if(!s||s.done||!needAlive(s))return;
  const sc=s.scenes[i];if(!sc||sc.used)return;
  const txt=SCENES[sc.k]?.f(s);
  if(!txt)return toast('当前条件不满足');
  sc.used=true;log(s,'me',`你 ${txt}`);
  if(over(s))return finish();
  lockIfDown(s);
  scheduleRender();
}
function meleeDmg(from,to){
  let raw=4*powMul(from.dc)*gapMul(from.dc,to.dc);
  if(from.dc+12<=to.dc)raw*=.5;
  return Math.max(1,Math.round(raw));
}
function standMelee(){
  const s=S;if(!s||s.done||s.me.meleed||!needAlive(s))return;
  if(s.me.滞涩>=5)return toast('滞涩过深');
  const t=needFoe(s);if(!t)return toast('先点一个敌人');
  s.me.meleed=true;fxSlash(t);fxCast(styleName(s.体裁,'近身'),'atk');fxFlash('hit');
  const spread=s.spread&&livingFoes(s).length>=2;
  const d=hit(s,s.me,t,Math.max(1,Math.round(meleeDmg(s.me,t)*(spread?0.7:1))));
  let extra='';
  if(spread){
    const bits=livingFoes(s).filter(f=>f!==t).map(x=>woundText(x,hit(s,s.me,x,Math.max(1,Math.round(meleeDmg(s.me,x)*.4))),s.me));
    if(bits.length)extra=` 群攻${bits.join('、')}`;
  }
  log(s,'me',`你 ${styleName(s.体裁,'近身')} → ${woundText(t,d,s.me)}${extra}`);
  if(over(s))return finish();
  lockIfDown(s);
  scheduleRender();
}
function toggleSpread(){
  const s=S;if(!s||s.done||!needAlive(s))return;
  if(livingFoes(s).length<2)return toast('只有一个敌人');
  s.spread=!s.spread;
  render();
}
function standPress(all){
  const s=S;if(!s||s.done||s.me.pressed||!needAlive(s))return;
  if(s.me.sp<1)return toast('神识不够');
  if(all){
    const list=livingFoes(s);
    if(!list.length)return toast('没有敌人');
    s.me.sp--;s.me.pressed=true;
    const bits=list.map(t=>{
      if(s.me.dc<t.dc)return`${t.名} 压不住`;
      return`${t.名} ${press(s,s.me,t)}`;
    });
    log(s,'me',`你 ${styleName(s.体裁,'群压')} → ${bits.join('；')}`);
  }else{
    const t=needFoe(s);if(!t)return toast('先点一个敌人');
    s.me.sp--;s.me.pressed=true;
    fxCast(styleName(s.体裁,'威压'),'util');fxFlash('cast');
    log(s,'me',`你 ${styleName(s.体裁,'威压')} → ${t.名} ${press(s,s.me,t)}`);
  }
  if(over(s))return finish();
  lockIfDown(s);
  scheduleRender();
}
function standBurn(){
  const s=S;if(!s||s.done||!needAlive(s))return;
  if(!burnOk(s.me))return toast(s.me.burned?'一场只能燃一次':s.me.bl<s.me.blMax*.4?'精血低于四成':'精血不足');
  const cost=burnCost(s.me);
  s.me.bl-=cost;s.me.burned=true;
  fxFlash('burn');fxCast(styleName(s.体裁,'燃血'),'atk');
  const mul=hasRoot(s.me,'火')?1:0.8;
  s.me.增伤=(s.me.增伤||0)+mul;s.me.费+=2;
  log(s,'me',`你 ${styleName(s.体裁,'燃血')} → 本回合伤害 ×${hasRoot(s.me,'火')?'2.0':'1.8'}，费用+2（现${s.me.费}），精血-${cost} 余${s.me.bl}/${s.me.blMax}`);
  scheduleRender();
}
function fleeRate(s){
  const foe=peekFoe(s)||s.foe;
  const it=(planActs(s,foe,1)[0]||{});
  return clamp(55+(s.me.dc-foe.dc)*1.5+(s.me.遁加||0)+(hasRoot(s.me,'风')?10:0)
    -s.me.滞涩*8-(it.型==='atk'?15:0)-(foe.逼角?20:0),5,95);
}
function standFlee(){
  const s=S;if(!s||s.done||!needAlive(s))return;
  if(s.me.mp<1||s.me.sp<1)return toast('灵力或神识不够');
  s.me.mp--;s.me.sp--;
  const rate=fleeRate(s);
  const roll=Math.floor(rnd(s.seed+s.turn*977+s.fleeTry*31)*100);
  s.fleeTry++;
  if(roll<rate){log(s,'me',`你 ${styleName(s.体裁,'遁')} → 成功率${Math.round(rate)}% 掷${roll} 脱战`);s.done='脱战';return finish()}
  log(s,'me',`你 ${styleName(s.体裁,'遁')} → 成功率${Math.round(rate)}% 掷${roll} 失败`);
  s.me.锁牌=true;
  endTurn(true);
}
function endTurn(punish){
  const s=S;if(!s||s.done)return;
  s.discard.push(...s.hand);s.hand=[];
  if(!punish)log(s,'sys','你结束');
  woodTick(s);
  (s.foes||[s.foe]).forEach(f=>tickBurn(s,f));
  if(over(s))return finish();
  allyTurn(s);
  if(s.done)return finish();
  foeTurn(s,!!punish);
  if(s.done)return finish();
  tickBurn(s,s.me);
  (s.allies||[]).forEach(a=>tickBurn(s,a));
  if(over(s))return finish();
  if(s.me.看穿>0)s.me.看穿--;
  if(s.迷雾>0)s.迷雾--;
  s.me.锁牌=false;
  s.turn++;
  startTurn(s);
  save().then(()=>scheduleRender(420));
}

let statCache={};
function readStat(){
  let raw={};
  try{
    if(typeof Mvu!=='undefined'&&Mvu.getMvuData){
      const id=typeof getCurrentMessageId==='function'?getCurrentMessageId():'latest';
      raw=obj(Mvu.getMvuData({type:'message',message_id:id})?.stat_data);
      if(!Object.keys(raw).length)raw=obj(Mvu.getMvuData({type:'message',message_id:'latest'})?.stat_data);
    }
  }catch(e){console.warn('[战斗] Mvu 读取失败',e)}
  if(!Object.keys(raw).length){try{raw=obj((typeof getAllVariables==='function'?getAllVariables():{})?.stat_data)}catch(e){}}
  statCache=obj(unwrap(raw));return statCache;
}
function childObj(p,k){const cur=p[k],inner=nodeOf(cur);
  if(inner&&typeof inner==='object'&&!Array.isArray(inner))return inner;
  const fresh={};if(Array.isArray(cur))cur[0]=fresh;else p[k]=fresh;return fresh}
function setLeaf(p,k,v){const cur=p[k];if(Array.isArray(cur))cur[0]=v;else p[k]=v}
async function commit(mutate){
  if(typeof Mvu==='undefined'||!Mvu.replaceMvuData)return false;
  try{
    const last=typeof getLastMessageId==='function'?getLastMessageId()
      :(typeof getCurrentMessageId==='function'?getCurrentMessageId():'latest');
    let target=last;
    if(typeof getChatMessages==='function'){const ms=getChatMessages('0-'+last,{role:'assistant'});
      if(ms?.length)target=ms.at(-1).message_id}
    const full=Mvu.getMvuData({type:'message',message_id:target});
    if(!full?.stat_data)return false;
    mutate(full.stat_data);
    await Mvu.replaceMvuData(full,{type:'message',message_id:target});
    return true;
  }catch(e){console.error('[战斗] 写回失败',e);toast(`写回失败：${e?.message||e}`);return false}
}
const packActor=a=>({hp:a.hp,格挡:a.格挡,sp:a.sp,mp:a.mp,bl:a.bl,滞涩:a.滞涩,i:a.i||0,
  burned:a.burned?1:0,meleed:a.meleed?1:0,护盾:a.护盾?1:0,反伤:a.反伤?1:0,看穿:a.看穿||0,冰封:a.冰封||0,
  灼烧:a.灼烧||0,闪避:a.闪避?1:0,减势:a.减势?1:0,隐匿:a.隐匿?1:0,封灵:a.封灵?1:0,
  逼角:a.逼角?1:0,闪后抽:a.闪后抽?1:0,遁加:a.遁加||0,
  stack:a.stack||1,atkMul:a.atkMul||1,基hpMax:a.基hpMax||a.hpMax,vsDc:a.vsDc||0,显示:a.显示||'',
  基dc:a.基dc!=null?a.基dc:a.dc,dc:a.dc,势标:a.势标||'',每回合:a.每回合||0});
async function save(){
  if(!S)return;
  await commit(st=>{
    const b=childObj(st,'_战斗');
    setLeaf(b,'状态',S.done?'已结束':'进行中');
    setLeaf(b,'战斗ID',S.id);
    setLeaf(b,'结果',S.done||'');
    setLeaf(b,'回合',S.turn);
    setLeaf(b,'对手',(S.foes||[S.foe]).map(f=>f.名).join('、'));
    setLeaf(b,'瞄准',S.aim||0);
    b.我方=packActor(S.me);b.敌方=(S.foes||[S.foe]).map(packActor);b.队友=(S.allies||[]).map(packActor);
    setLeaf(b,'种子',S.seed);
    setLeaf(b,'弃牌',S.discard.map(c=>c.uid).join(','));
    setLeaf(b,'手牌',S.hand.map(c=>c.uid).join(','));
    setLeaf(b,'已用场景',S.scenes.filter(x=>x.used).map(x=>x.k).join(','));
    setLeaf(b,'待处置',S.awaitFate?1:0);
    setLeaf(b,'处置',(S.fate||[]).map(x=>`${x.名}|${x.pick}`).join(','));
    setLeaf(b,'群攻',S.spread?1:0);
    setLeaf(b,'体裁',S.体裁||'近战');
  });
}
function makeFate(s){
  return(s.foes||[]).filter(f=>f&&f.hp<=0&&(f.stack||1)<=1)
    .map(f=>({名:f.显示||f.名,rec名:f.rec名||f.显示||f.名,stack:1,pick:'beat'}));
}
function writeRec(root,名,hp,tag,opt={}){
  if(!名)return;
  const bags=[
    [root.当前在场互动女性,false],
    [root.当前在场互动男性,false],
    [root.女性角色档案,true],
    [root.男性角色档案,true],
  ];
  bags.forEach(([bag,canStatus])=>{
    if(opt.presentOnly&&canStatus)return;
    const hit=recPick(bag,名);
    if(!hit)return;
    const rec=nodeOf(obj(bag)[hit.key]);
    if(!rec||typeof rec!=='object')return;
    setLeaf(rec,'生命',hp);
    if(tag&&canStatus){
      const old=String(nodeOf(rec.状态)||'');
      const keep=old==='无异常'||!old?'':old;
      const bits=new Set((keep?keep.split(/[、,，]/):[]).filter(x=>x&&x!=='死亡'&&x!=='重伤'));
      bits.add(tag);
      setLeaf(rec,'状态',[...bits].join('、'));
    }
  });
}
function partyNames(s){
  return['你'].concat((s.allies||[]).map(a=>a.显示||a.名)).filter(Boolean);
}
function writeHero(root,s){
  const hero=childObj(root,'主角');
  if(s.done!=='负')setLeaf(hero,'生命',s.writeback.生命);
  setLeaf(hero,'灵力',s.writeback.灵力);
  setLeaf(hero,'神识',s.writeback.神识);
  if(s.me.burned||s.me.bl<s.me.blMax)setLeaf(hero,'精血',s.writeback.精血);
  if(s.done!=='负'&&s.writeback.状态){
    const old=String(nodeOf(hero.状态)||'无异常');
    const keep=old==='无异常'||!old?'':old;
    const bits=new Set((keep?keep.split(/[、,，]/):[]).concat(s.writeback.状态.split('、')).filter(Boolean));
    setLeaf(hero,'状态',[...bits].join('、')||'无异常');
  }else if(s.done==='负'&&s.me.burned){
    const old=String(nodeOf(hero.状态)||'无异常');
    const keep=old==='无异常'||!old?'':old;
    const bits=new Set((keep?keep.split(/[、,，]/):[]).concat(['精血亏空']).filter(x=>x&&x!=='死亡'));
    setLeaf(hero,'状态',[...bits].join('、')||'无异常');
  }
  const gear=childObj(hero,'器物');
  rows(s.wear).forEach(([名,add])=>{const g=nodeOf(gear[名]);
    if(g&&typeof g==='object')setLeaf(g,'损耗度',clamp(num(nodeOf(g.损耗度))+add,0,100))});
  const b=childObj(root,'_战斗');
  setLeaf(b,'状态','已结束');setLeaf(b,'结果',s.done);setLeaf(b,'战斗ID',s.id);
  setLeaf(b,'对手',(s.foes||[s.foe]).map(f=>f.名).join('、'));
  setLeaf(b,'结算楼层',typeof getLastMessageId==='function'?getLastMessageId():0);
  setLeaf(b,'待处置',s.awaitFate?1:0);
  setLeaf(b,'处置',(s.fate||[]).map(x=>`${x.名}|${x.pick}`).join(','));
  if('战报' in b)delete b.战报;
  b.我方=packActor(s.me);b.敌方=(s.foes||[s.foe]).map(packActor);b.队友=(s.allies||[]).map(packActor);
}
async function finish(){
  const s=S;if(!s)return;
  if(!s.done){
    if(!livingFoes(s).length)s.done='胜';
    else if(!livingParty(s).length)s.done='负';
  }
  s.drill=isDrill(s);
  const foeHp=(s.foes||[s.foe]).map(f=>`${f.名}${f.hp<=0?'倒下':`余血${Math.max(0,Math.round(f.hp))}`}`).join(' ');
  log(s,'sys',`结果 ${s.done} · 你生命${Math.max(0,s.me.hp)}/${s.me.hpMax} ${foeHp}`);
  const pct=(v,m)=>clamp(Math.round(Math.max(0,v)/m*100),0,100);
  s.writeback={
    生命:pct(s.me.hp,s.me.hpMax),灵力:pct(s.me.mp,s.me.mpMax),
    神识:pct(s.me.sp,s.me.spMax),精血:pct(s.me.bl,s.me.blMax)
  };
  const st=[];
  if(s.done!=='负'){
    if(s.writeback.生命<=0)st.push(s.drill?'重伤':'死亡');
    else if(s.writeback.生命<25)st.push('重伤');
  }
  if(s.writeback.神识<20)st.push('神识刺痛');
  if(s.writeback.灵力===0)st.push('灵力枯竭');
  if(s.me.burned)st.push('精血亏空');
  s.writeback.状态=st.length?st.join('、'):'';
  s.fate=s.done==='胜'&&!s.drill?makeFate(s):[];
  s.awaitFate=s.fate.length>0;
  if(s.drill&&s.done==='胜')log(s,'sys','演练结束，不处置生死');
  if(s.done==='负'){
    const party=partyNames(s).join('、');
    const foes=(s.foes||[]).map(f=>f.显示||f.名).join('、')||'敌人';
    const kind=s.drill?'演练/切磋':'遭遇或死斗';
    log(s,'sys',`战败。请根据具体场景、战斗性质（${kind}）以及敌人（${foes}）的性格，决定主角团各方（${party}）各自是被击杀、击败生还，还是濒死留下。胜负已定，不要改成打赢。`);
  }
  const pctA=a=>clamp(Math.round(Math.max(0,a.hp)/a.hpMax*100),0,100);
  await commit(root=>{
    writeHero(root,s);
    if(s.done==='负')return;
    const named=a=>(a.stack||1)>1?null:(a.rec名||a.显示||a.名);
    if(s.drill){
      (s.foes||[]).forEach(f=>{const n=named(f);if(n)writeRec(root,n,pctA(f),'',{presentOnly:true})});
      (s.allies||[]).forEach(a=>{const n=named(a);if(n)writeRec(root,n,pctA(a),'',{presentOnly:true})});
      return;
    }
    if(!s.awaitFate)(s.foes||[]).forEach(f=>{const n=named(f);if(n)writeRec(root,n,pctA(f))});
    (s.allies||[]).forEach(a=>{const n=named(a);if(n)writeRec(root,n,pctA(a))});
  });
  busy=false;
  if(s.done==='胜'){fxBanner('胜','win');fxWin()}
  else if(s.done==='负')fxBanner('负','lose');
  else if(s.done==='脱战')fxBanner('脱战','flee');
  scheduleRender(s.done==='胜'?720:560);
}
async function confirmFate(){
  const s=S;if(!s||!s.awaitFate)return;
  (s.fate||[]).forEach(x=>log(s,'sys',`处置 ${x.名} ${x.pick==='kill'?'死亡':'击败'}`));
  s.awaitFate=false;
  await commit(root=>{
    writeHero(root,s);
    (s.fate||[]).forEach(x=>{
      if((x.stack||1)>1)return;
      if(x.pick==='kill')writeRec(root,x.rec名,0,'死亡');
      else writeRec(root,x.rec名,8,'重伤');
    });
  });
  toast('处置已写入');
  render();
}
function dummyName(名){return /傀儡|木人|稻草人|靶子|假人|影傀|木桩/.test(String(名||''))}
function isDrill(s){
  if(/演练|切磋|试炼/.test(s.性质||''))return true;
  if(/演练|试炼|切磋|比试|点到为止|试招|试剑/.test(`${s.起因||''}${s.地形||''}`))return true;
  const foes=s.foes||[];
  return !!foes.length&&foes.every(f=>dummyName(f.显示||f.名));
}
function reportText(s){
  const names=(s.foes||[]).map(f=>f.显示||f.名).join('、');
  const head=`【战报】 ${s.done||'进行中'} · ${s.drill?'演练/切磋，不写生死 · ':''}${s.起因||`对阵${names}`}`;
  const lines=s.log.filter(x=>x.who!=='sys'||/开场|结果|灼烧|闪开|春荣|遁走|处置|倒下|演练|战败/.test(x.t)).slice(-36).map(x=>x.t);
  if(s.awaitFate)(s.fate||[]).forEach(x=>lines.push(`处置 ${x.名} ${x.pick==='kill'?'死亡':'击败'}（未确认）`));
  return [head].concat(lines).concat([LOG_HINT]).join('\n');
}
function copyReport(){
  if(!S)return;
  const t=reportText(S);
  const done=()=>toast('已复制，贴进下一句即可');
  const fall=()=>{
    const ta=document.createElement('textarea');
    ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){toast('复制失败，请自己选中')}
    document.body.removeChild(ta);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(fall);
  else fall();
}

function seedFromReplace(){
  const el=qs('#bt-raw-seed');
  const t=String(el&&el.value||'').trim();
  if(!t||t==='$1'||t==='$&')return '';
  return t;
}
function extractBattleBlock(text){
  const raw=String(text||'');
  const whole=raw.match(/<战斗>[\s\S]*?<\/战斗>/);
  if(whole)return whole[0].trim();
  const inner=raw.match(/<战斗>([\s\S]*?)<\/战斗>/);
  if(inner)return '<战斗>\n'+inner[1].trim()+'\n</战斗>';
  const t=raw.trim();
  if(t&&/对手\s*[:：]/.test(t))return '<战斗>\n'+t+'\n</战斗>';
  return t;
}
function currentSource(){
  if(debugOverride)return debugOverride;
  return extractBattleBlock(seedFromReplace())||extractBattleBlock(readMessageText());
}
function fillDebugSource(force){
  const ta=qs('#bt-dbg-src');if(!ta)return '';

}
function setDebugOpen(open){

function applyDebugTag(){

function readTag(){
  const text=currentSource();
  const blk=text.match(/<战斗>([\s\S]*?)<\/战斗>/);
  const out={对手:[],队友:[],起因:'',地形:'',场景:[],场景原文:'',性质:'',体裁:'',势:[]};
  if(!blk)return out;
  blk[1].split(/\n+/).forEach(line=>{
    const m=line.match(/^\s*([^:：]+)[:：]\s*(.+?)\s*$/);
    if(!m)return;
    const k=m[1].trim(),v=m[2].trim();
    if(k==='对手')out.对手.push(...parseUnits(v));
    else if(k==='队友')out.队友.push(...parseUnits(v));
    else if(k==='起因')out.起因=v;
    else if(k==='地形')out.地形=v;
    else if(k==='性质')out.性质=v;
    else if(k==='体裁')out.体裁=v.replace(/\s+/g,'');

function restore(saved,fresh){

    a.mp=num(d.mp,a.mp);a.bl=num(d.bl,a.bl);a.滞涩=num(d.滞涩);a.i=num(d.i);

    a.闪避=!!num(d.闪避);a.减势=!!num(d.减势);a.隐匿=!!num(d.隐匿);
    a.封灵=!!num(d.封灵);a.逼角=!!num(d.逼角);a.闪后抽=!!num(d.闪后抽);a.遁加=num(d.遁加,a.遁加);
    if(d.stack!=null)a.stack=clamp(num(d.stack,a.stack||1),1,99);
    if(d.atkMul!=null)a.atkMul=num(d.atkMul,a.atkMul||1);
    if(d.基hpMax)a.基hpMax=num(d.基hpMax,a.基hpMax);
    if(d.vsDc!=null)a.vsDc=num(d.vsDc,a.vsDc);
    if(d.显示)a.显示=String(d.显示);
    if(d.基dc!=null)a.基dc=num(d.基dc,a.基dc);
    if(d.dc!=null)a.dc=num(d.dc,a.dc);
    if(d.势标)a.势标=String(d.势标);
    if(d.每回合!=null)a.每回合=num(d.每回合,a.每回合);
    if((a.stack||1)>1||a.显示)renameStack(a);
  };
  load(s.me,obj(saved.我方));
  const packed=Array.isArray(saved.敌方)?saved.敌方:[saved.敌方];
  (s.foes||[]).forEach((f,i)=>load(f,obj(packed[i])));
  const pals=Array.isArray(saved.队友)?saved.队友:[];
  (s.allies||[]).forEach((a,i)=>load(a,obj(pals[i])));
  s.foe=s.foes[num(saved.瞄准)]||s.foes.find(f=>f.hp>0)||s.foes[0];
  s.aim=Math.max(0,s.foes.indexOf(s.foe));
  s.mark={k:'foe',i:s.aim};
  s.turn=num(saved.回合,1);s.done=String(saved.结果||'');
  s.spread=!!num(saved.群攻);
  const byUid=u=>s.all.find(c=>c.uid===u);
  const pick=str=>String(str||'').split(',').filter(Boolean).map(byUid).filter(Boolean);
  s.hand=pick(saved.手牌);s.discard=pick(saved.弃牌);
  const used=new Set([...s.hand,...s.discard]);
  s.deck=shuffle(s.all.filter(c=>!used.has(c)),s.seed);
  const usedSc=new Set(String(saved.已用场景||'').split(',').filter(Boolean));
  s.scenes.forEach(sc=>{if(usedSc.has(sc.k))sc.used=true});
  if(Array.isArray(saved.战报))s.log=saved.战报.map(t=>({who:'sys',t}));
  s.awaitFate=!!num(saved.待处置)&&s.done==='胜'&&!isDrill(s);
  const rawFate=String(saved.处置||'');
  if(rawFate){
    s.fate=rawFate.split(',').filter(Boolean).map(row=>{
      const [名,pick]=row.split('|');
      const f=(s.foes||[]).find(x=>x.名===名)||{};
      return{名,rec名:f.rec名||f.显示||名,stack:f.stack||1,pick:pick==='kill'?'kill':'beat'};
    }).filter(x=>(x.stack||1)<=1);
  }else s.fate=s.awaitFate?makeFate(s):[];
  if(!s.fate.length)s.awaitFate=false;
  return s;
}
