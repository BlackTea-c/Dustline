const dowOf=day=>new Date(MK_EPOCH+day*86400000).getUTCDay();
const isWeekday=d=>d>=1&&d<=5;
const prevTradingDay=day=>{let d=day-1;while(!isWeekday(dowOf(d)))d--;return d};
const dayFromISO=s=>{const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?Math.round((Date.UTC(num(m[1]),num(m[2])-1,num(m[3]))-MK_EPOCH)/86400000):-99999};
const round2=v=>Math.round(v*100)/100;
const money2=v=>Number(v).toFixed(2);
const moneyTxt=v=>moneyInt(v).toLocaleString('en-US');
function parseWorldTime(raw){
  const t=String(raw??''),y=t.match(/(\d{4})\s*年/);
  if(!y)return null;
  const mo=t.match(/年\D{0,4}?(\d{1,2})\s*月/),da=t.match(/月\D{0,4}?(\d{1,2})\s*日/),hm=t.match(/(\d{1,2})\s*[:：点时]\s*(\d{1,2})?/);
  return{y:num(y[1]),m:mo?num(mo[1]):1,d:da?num(da[1]):1,hour:hm?num(hm[1]):10,min:hm&&hm[2]?num(hm[2]):0};
}
function worldClock(){
  const p=parseWorldTime(world().当前时间);
  if(!p||p.y<1991)return null;
  if(String(val(world().当前界域,'地球'))!=='地球')return null;
  const day=Math.round((Date.UTC(p.y,p.m-1,p.d)-MK_EPOCH)/86400000);
  return{...p,day,hour:p.hour+p.min/60};
}
const fxRate=day=>round2(6.31*(1+fbm(hashStr('FX'),day/40)*.02)*100)/100;
function rawPrice(s,day,hour){
  const seed=hashStr(s.码+s.名),age=Math.max(0,day-(s.上市?dayFromISO(s.上市):0)),
    slowRamp=Math.min(1,age/260),midRamp=Math.min(1,age/40),
    trend=vnoise(seed,day/61)*s.幅*24*slowRamp+vnoise(seed^0x1234,day/13)*s.幅*9*midRamp,
    daily=(rnd01(seed^(day*2654435761))*2-1)*s.幅,
    intra=vnoise(seed^0x77,day+(hour-9.5)/5.5)*s.幅*.6;
  return s.基*Math.exp(trend+daily+intra);
}
function shockOf(s,day){
  const r=rnd01(hashStr(s.码+'shock')^(day*2654435761));
  if(r<.020)return{v:.06+rnd01(hashStr(s.码)+day*7)*.13,tag:'资金异动'};
  if(r>.980)return{v:-(.06+rnd01(hashStr(s.码)+day*11)*.13),tag:'恐慌抛售'};
  return null;
}
function haltOf(s,day){
  for(let k=0;k<3;k++){
    const d=day-k;
    if(rnd01(hashStr(s.码+'halt')^(d*40503))<.010){
      const len=1+Math.floor(rnd01(hashStr(s.码+'len')+d)*3);
      if(k<len)return{until:d+len-1,left:len-k};
    }
  }
  return null;
}
function marketMood(){
  const w=world(),lv=MK_CRISIS[String(val(w.危机程度,'无'))]??0,tens=rows(w.世界局势).map(([,d])=>clamp(obj(d).紧张度));
  const avg=tens.length?tens.reduce((a,b)=>a+b,0)/tens.length:0;
  return{lv,tension:Math.round(avg),drift:-(lv*.035)-(avg/100)*.02};
}
function newsFeed(){
  const w=world(),out=[],push=(src,title,d)=>{
    const o=obj(d),text=[title,o.描述,o.内容,o.标题,o.摘要,o.影响,o.行动,o.全球影响,o.评论].filter(Boolean).join(' ');
    if(text)out.push({src,title:String(o.标题||title),text,全球:src==='全球'||src==='局势'});
  };
  rows(w.动向).forEach(([t,d])=>push('本地',t,d));
  rows(w.政府动向).forEach(([t,d])=>push('政府',t,d));
  rows(w.军事动向).forEach(([t,d])=>push('军事',t,d));
  rows(w.国家动向).forEach(([t,d])=>push('国家',t,d));
  rows(w.全球动向).forEach(([t,d])=>push('全球',t,d));
  rows(w.世界局势).forEach(([t,d])=>push('局势',t,d));
  rows(stat.互联网).forEach(([t,d])=>push('网络',t,d));
  return out;
}
const toneOf=text=>{let s=0;MK_GOOD.forEach(k=>{if(text.includes(k))s++});MK_BAD.forEach(k=>{if(text.includes(k))s--});return Math.max(-3,Math.min(3,s))};
function roster(){
  const extra=rows(stat.所处势力)
    .filter(([n,d])=>String(obj(d).类型)==='企业'&&!MARKET.some(s=>s.名===n))
    .map(([n])=>{const h=hashStr(n);return{市:'a',码:('00'+h%1000000).slice(-6),名:n,板:'综合',基:6+h%3500/100,幅:.036,词:[n],自:true}});
  return[...MARKET,...extra];
}
function quoteAll(clock){
  const mood=marketMood(),feed=newsFeed(),prevDay=prevTradingDay(clock.day),
    dead={};
  rows(stat.所处势力).forEach(([n,d])=>{if(MK_DEAD.test(String(val(obj(d).势力状态,''))))dead[n]=true});
  return roster().map(s=>{
    const v=MK_VENUES[s.市],listed=s.上市?dayFromISO(s.上市):-99999,
      news=feed.filter(f=>[s.名,...(s.词||[])].some(k=>k&&f.text.includes(k))).map(f=>({...f,tone:toneOf(f.text)})),
      hit=news.map(n=>n.text).join(' '),
      tone=news.reduce((a,n)=>a+n.tone,0),
      localWeight=v.本地?1:.3,
      macro=news.some(n=>n.全球)||v.本地?1:.6,
      sector=(MK_BETA[s.板]??-.4)*mood.lv*.03*localWeight,
      bias=mood.drift*localWeight*macro+sector+Math.max(-.05,Math.min(.05,tone*.016)),
      prev=rawPrice(s,prevDay,15),
      shock=shockOf(s,clock.day),
      halt=haltOf(s,clock.day),
      st=v.本地&&prev<s.基*.35,
      cap=st?.05:(v.限||.18);
    let flag=null;
    if(clock.day<listed)flag={k:'未上市',t:`${s.上市} 挂牌`};
    else if(dead[s.名]||MK_DEAD.test(hit))flag={k:'退市',t:'已摘牌 · 仅可清仓'};
    else if(MK_HALT.test(hit))flag={k:'停牌',t:'公告停牌'};
    else if(halt)flag={k:'停牌',t:`临时核查 · 还剩${halt.left}日`};
    let price,chg;
    if(flag&&flag.k==='未上市'){
      price=0;chg=0;
    }else if(flag){
      price=flag.k==='退市'?round2(prev*.4):round2(prev);
      chg=flag.k==='退市'?-.6:0;
    }else{
      chg=Math.max(-cap,Math.min(cap,rawPrice(s,clock.day,clock.hour)*(1+bias+(shock?shock.v:0))/prev-1));
      price=Math.max(.01,round2(prev*(1+chg)));
    }
    return{...s,venue:v,prev,price,chg,news,shock:flag?null:shock,flag,st,cap,tradable:!flag||flag.k==='退市',canBuy:!flag,canSell:!flag||flag.k==='退市'};
  });
}
const nodeOf=v=>Array.isArray(v)?nodeOf(v[0]):v;
function childObj(parent,key){
  const cur=parent[key],inner=nodeOf(cur);
  if(inner&&typeof inner==='object'&&!Array.isArray(inner))return inner;
  const fresh={};
  if(Array.isArray(cur))cur[0]=fresh;else parent[key]=fresh;
  return fresh;
}
function setLeaf(parent,key,v){const cur=parent[key];if(Array.isArray(cur))cur[0]=v;else parent[key]=v}
const leafNum=(parent,key)=>num(nodeOf(obj(parent)[key]));
const purse=()=>obj(obj(hero().资产).货币);
const cnyKey=()=>Object.keys(purse()).find(k=>/人民币|现金|存款|RMB/i.test(k))||'人民币';
const walletOf=cur=>moneyInt(obj(purse()[cur==='人民币'?cnyKey():cur]).数量);
const deskOf=()=>obj(obj(hero().资产)._股市);
let mkLots=1;
const curVenue=()=>subState.mkt==='us'?'us':'a';
function cashAccount(ctx,cur){
  const key=cur==='人民币'?cnyKey():cur,acc=childObj(ctx.money,key);
  if(acc.数量===undefined)acc.数量=0;
  if(acc.单位===undefined)acc.单位=cur==='美元'?'美元':'元';
  if(acc.说明===undefined)acc.说明=cur==='美元'?'境外证券账户':'证券账户结算';
  return acc;
}
function spend(ctx,cur,amount,day){
  amount=moneyInt(amount);
  const acc=cashAccount(ctx,cur),bal=moneyInt(nodeOf(acc.数量));
  if(bal>=amount){setLeaf(acc,'数量',bal-amount);return null}
  if(cur==='人民币')return`现金不足，还差 ${moneyTxt(amount-bal)} 元`;
  const rate=fxRate(day),need=moneyInt((amount-bal)*rate*1.003),rmb=cashAccount(ctx,'人民币'),rb=moneyInt(nodeOf(rmb.数量));
  if(rb<need)return`美元与人民币都不够，还差约 ${moneyTxt(need-rb)} 元`;
  setLeaf(rmb,'数量',rb-need);
  setLeaf(acc,'数量',0);
  return null;
}
function credit(ctx,cur,amount){
  const acc=cashAccount(ctx,cur);
  setLeaf(acc,'数量',moneyInt(nodeOf(acc.数量))+moneyInt(amount));
}
function buyingPower(cur,day){
  if(cur==='人民币')return walletOf('人民币');
  return walletOf(cur)+walletOf('人民币')/(fxRate(day)*1.003);
}
async function commitMarket(mutate){
  if(typeof Mvu==='undefined'||typeof Mvu.replaceMvuData!=='function'){toast('当前环境无法写回变量');return false}
  try{
    const last=typeof getLastMessageId==='function'?getLastMessageId():(typeof getCurrentMessageId==='function'?getCurrentMessageId():'latest');
    let target=last;
    if(typeof getChatMessages==='function'){const ms=getChatMessages('0-'+last,{role:'assistant'});if(ms?.length)target=ms.at(-1).message_id}
    const full=Mvu.getMvuData({type:'message',message_id:target});
    if(!full?.stat_data){toast('没有可写回的变量');return false}
    const hero0=childObj(full.stat_data,'主角'),asset=childObj(hero0,'资产'),
      ctx={money:childObj(asset,'货币'),desk:childObj(asset,'_股市')};
    ctx.hold=childObj(ctx.desk,'持仓');
    const note=mutate(ctx);
    if(!note)return false;
    await Mvu.replaceMvuData(full,{type:'message',message_id:target});
    renderAll();
    toast(note);
    return true;
  }catch(e){console.error('[命轨] 交易写回失败',e);toast(`交易失败：${e?.message||e}`);return false}
}
function marketOrder(dir,name){
  const clock=worldClock();
  if(!clock)return toast('此地此时没有股市');
  const q=quoteAll(clock).find(s=>s.名===name);
  if(!q)return toast('查无此股');
  if(dir==='买入'&&!q.canBuy)return toast(`${name} ${q.flag.k}，无法买入`);
  if(dir==='卖出'&&!q.canSell)return toast(`${name} ${q.flag.k}，无法卖出`);
  const cur=q.venue.币,unit=q.venue.手,held=leafNum(obj(deskOf().持仓)[name],'股数');
  let shares;
  if(mkLots==='all')shares=dir==='买入'?Math.floor(buyingPower(cur,clock.day)/(q.price*unit*1.001))*unit:held;
  else shares=mkLots*unit;
  if(shares<unit)return toast(dir==='买入'?`${cur}不足一手`:'没有可卖的股份');
  if(dir==='卖出'&&shares>held)shares=Math.floor(held/unit)*unit||held;
  return commitMarket(ctx=>{
    const gross=moneyInt(q.price*shares),sym=q.venue.符;
    if(dir==='买入'){
      const fee=Math.max(q.市==='a'?5:1,moneyInt(gross*.0003)),err=spend(ctx,cur,gross+fee,clock.day);
      if(err){toast(err);return''}
      const cell=childObj(ctx.hold,name),had=leafNum(cell,'股数'),cost=leafNum(cell,'成本');
      setLeaf(cell,'股数',had+shares);
      setLeaf(cell,'成本',round2((had*cost+gross+fee)/(had+shares)));
      return`买入 ${name} ${shares} 股 @ ${sym}${money2(q.price)}`;
    }
    const cell=nodeOf(ctx.hold[name]),have=cell?leafNum(cell,'股数'):0;
    if(have<shares){toast(`持仓不足，只有 ${have} 股`);return''}
    const fee=Math.max(q.市==='a'?5:1,moneyInt(gross*.0003))+ (q.市==='a'?moneyInt(gross*.001):0),net=moneyInt(gross-fee),cost=leafNum(cell,'成本');
    credit(ctx,cur,net);
    if(have-shares<=0)delete ctx.hold[name];else setLeaf(cell,'股数',have-shares);
    setLeaf(ctx.desk,'累计盈亏',moneyInt(leafNum(ctx.desk,'累计盈亏')+(net-cost*shares)*(cur==='美元'?fxRate(clock.day):1)));
    return`卖出 ${name} ${shares} 股 @ ${sym}${money2(q.price)}`;
  });
}
const tickTone=v=>v>0.0005?'up':v<-0.0005?'down':'flat';
const pct=v=>`${v>0?'+':''}${(v*100).toFixed(2)}%`;
